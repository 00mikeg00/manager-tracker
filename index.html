<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Splitting — Tracker</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f4f0;
    color: #1f1f1d;
    margin: 0;
    padding: 2rem 1rem;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: #6b6a65; font-size: 14px; margin: 0 0 16px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab-btn {
    font-size: 14px; padding: 8px 16px; border: 1px solid #d8d6cf;
    background: #fff; border-radius: 8px; cursor: pointer; color: #6b6a65;
  }
  .tab-btn.active { background: #1f1f1d; color: #fff; border-color: #1f1f1d; }
  .panel { display: none; }
  .panel.active { display: block; }
  .add-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .add-row2 { display: flex; gap: 8px; margin-bottom: 20px; }
  input, select, textarea {
    font-size: 14px; padding: 8px 10px; border: 1px solid #d8d6cf;
    border-radius: 8px; background: #fff; font-family: inherit;
  }
  input[type=text] { flex: 1; min-width: 140px; }
  textarea { flex: 1; resize: vertical; min-height: 36px; }
  button {
    font-size: 14px; padding: 8px 14px; border: 1px solid #1f1f1d;
    background: #1f1f1d; color: #fff; border-radius: 8px; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary { background: transparent; color: #1f1f1d; border: 1px solid #d8d6cf; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid #e5e3db; }
  th, td { text-align: left; padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #efeee8; vertical-align: top; }
  th { color: #6b6a65; font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
  tbody tr.detail-row:last-child td { border-bottom: none; }
  tbody tr:not(.detail-row) { border-top: 1px solid #e5e3db; }
  tbody tr:first-child { border-top: none; }
  td.actions { text-align: right; white-space: nowrap; }
  td.actions button { padding: 4px 8px; font-size: 12px; margin-left: 4px; }
  select.stage-select { font-size: 12px; padding: 4px 6px; }
  .detail-row td { padding: 6px 12px 14px; border-bottom: 2px solid #c9c7bd; }
  .detail-grid { display: flex; gap: 16px; align-items: flex-start; }
  .detail-grid .dates { flex: 0 0 220px; padding-top: 8px; }
  .detail-grid textarea { flex: 1; min-height: 50px; font-size: 13px; }
  .dates { font-size: 11px; color: #9b9a94; line-height: 1.5; white-space: nowrap; }
  .empty, .status { text-align: center; color: #9b9a94; padding: 20px; font-size: 14px; }
  .error { color: #a03434; }
  .comp-notes { width: 100%; font-size: 12px; min-height: 32px; }
  .totals { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .total-box {
    flex: 1; min-width: 90px; background: #fff; border: 1px solid #e5e3db;
    border-radius: 10px; padding: 10px 12px;
  }
  .total-box.all { background: #1f1f1d; border-color: #1f1f1d; color: #fff; }
  .total-box .num { font-size: 22px; font-weight: 600; line-height: 1.2; }
  .total-box .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: #6b6a65; }
  .total-box.all .label { color: #c9c7bd; }
  .total-box.due { border-color: #d9a441; }
  .cat-filter { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .cat-btn {
    font-size: 13px; padding: 6px 12px; border: 1px solid #d8d6cf;
    background: #fff; border-radius: 999px; cursor: pointer; color: #6b6a65;
  }
  .cat-btn.active { background: #1f1f1d; color: #fff; border-color: #1f1f1d; }
  .cat-btn .count { opacity: 0.7; margin-left: 4px; }
  .field-label { font-size: 13px; color: #6b6a65; align-self: center; }
  .fit-checks { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 13px; color: #1f1f1d; }
  .fit-checks label { display: flex; gap: 4px; align-items: center; cursor: pointer; }
  .detail-grid .rel { flex: 0 0 240px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
  .detail-grid .rel select, .detail-grid .rel input { font-size: 12px; padding: 4px 6px; }
  .detail-grid .rel .fit-checks { font-size: 12px; gap: 8px; }
  .badge { display: inline-block; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; padding: 1px 6px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; }
  .badge.warm { background: #fbe3cf; color: #9a4a12; }
  .badge.cold { background: #e3ebf3; color: #3d5a78; }
  .intro { font-size: 11px; color: #6b6a65; margin-top: 2px; }
  .fit-tags { margin-top: 4px; }
  .fit-tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px; background: #efeee8; color: #4a4944; margin: 2px 4px 0 0; }
  input.followup { font-size: 12px; padding: 4px 6px; }
  input.followup.overdue { border-color: #a03434; color: #a03434; }
  input.followup.soon { border-color: #d9a441; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Splitting — tracker</h1>
  <p class="sub">Managers, lawyers, production companies and competitions, synced with Google Sheets.</p>

  <div class="tabs">
    <button class="tab-btn active" id="tabBtnManagers" onclick="switchTab('managers')">Contacts</button>
    <button class="tab-btn" id="tabBtnCompetitions" onclick="switchTab('competitions')">Competitions / labs</button>
  </div>

  <div class="panel active" id="panelManagers">
    <div class="cat-filter" id="catFilter"></div>
    <div class="totals" id="mgrTotals"></div>

    <div class="add-row">
      <select id="categoryInput">
        <option value="manager">Manager</option>
        <option value="lawyer">Lawyer</option>
        <option value="production">Production company</option>
      </select>
      <input type="text" id="companyInput" placeholder="Company name" />
      <input type="text" id="contactInput" placeholder="Contact name (optional)" />
      <input type="text" id="emailInput" placeholder="Email" />
      <select id="stageInput"></select>
    </div>
    <div class="add-row">
      <select id="warmthInput">
        <option value="">Warm / cold?</option>
        <option value="warm">Warm</option>
        <option value="cold">Cold</option>
      </select>
      <input type="text" id="introInput" placeholder="Who could introduce you? (optional)" />
      <label class="field-label" for="followupInput">Follow up:</label>
      <input type="date" id="followupInput" />
    </div>
    <div class="add-row">
      <span class="field-label">Fit:</span>
      <div class="fit-checks" id="fitInput"></div>
    </div>
    <div class="add-row2">
      <textarea id="notesInput" placeholder="Notes (optional)"></textarea>
      <button id="addBtn" onclick="addManager()">Add</button>
    </div>

    <div class="add-row" style="margin-bottom:14px;">
      <label style="font-size:13px; color:#6b6a65; align-self:center;">Sort by:</label>
      <select id="mgrSort" onchange="renderManagers()">
        <option value="recent">Most recent activity</option>
        <option value="followup">Follow-up date (soonest first)</option>
        <option value="fit">Best fit</option>
        <option value="company">Company name (A–Z)</option>
        <option value="status">Status</option>
      </select>
    </div>

    <div id="mgrStatus" class="status">Loading…</div>
    <table id="mgrTable" style="display:none;">
      <thead>
        <tr><th>Company</th><th>Type</th><th>Contact</th><th>Email</th><th>Stage</th><th>Follow up</th><th></th></tr>
      </thead>
      <tbody id="mgrTbody"></tbody>
    </table>
  </div>

  <div class="panel" id="panelCompetitions">
    <div class="add-row">
      <input type="text" id="compNameInput" placeholder="Competition / lab name" />
      <input type="text" id="compFeeInput" placeholder="Fee (e.g. $59)" style="max-width:110px;" />
      <input type="text" id="compDeadlineInput" placeholder="Deadline (e.g. Sept 20, 2026)" style="max-width:200px;" />
      <select id="compStatusInput">
        <option value="considering">Considering</option>
        <option value="submitted">Submitted</option>
        <option value="advanced">Advanced</option>
        <option value="not-selected">Not selected</option>
      </select>
      <button id="compAddBtn" onclick="addCompetition()">Add</button>
    </div>

    <div id="compStatus" class="status">Loading…</div>
    <table id="compTable" style="display:none;">
      <thead>
        <tr><th>Name</th><th>Fee</th><th>Deadline</th><th>Status</th><th>Notes</th><th></th></tr>
      </thead>
      <tbody id="compTbody"></tbody>
    </table>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzSIgRjjf9waWMqMvOKYduHb3LQ7QQ17TK4UlTOXZNsl0WYFSAsQRAl-fJpdGyIW1tYtw/exec';
let mgrRows = [];
let compRows = [];
const STAGES = [
  { value: 'flagged', label: 'Flagged', option: 'Flagged' },
  { value: 'sent', label: 'Sent', option: 'Sent email' },
  { value: 'nudge1', label: 'First nudge', option: 'First nudge' },
  { value: 'nudge2', label: 'Last nudge', option: 'Last nudge' },
  { value: 'responded', label: 'Responded', option: 'Responded' },
  { value: 'pilot', label: 'Has pilot', option: 'Has pilot' },
  { value: 'passed', label: 'Passed', option: 'Passed' }
];
const STAGE_LABELS = Object.fromEntries(STAGES.map(st => [st.value, st.label]));

function stageOptions(selected) {
  return STAGES.map(st => `<option value="${st.value}" ${st.value === selected ? 'selected' : ''}>${st.option}</option>`).join('');
}

function todayLabel() {
  return new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
const CATEGORIES = [
  { value: 'manager', label: 'Manager', plural: 'Managers' },
  { value: 'lawyer', label: 'Lawyer', plural: 'Lawyers' },
  { value: 'production', label: 'Production company', plural: 'Production companies' }
];
let currentCategory = 'manager';

// Rows saved before categories existed are managers.
function getCategory(r) {
  return CATEGORIES.some(c => c.value === r.category) ? r.category : 'manager';
}

function visibleRows() {
  return currentCategory === 'all' ? mgrRows : mgrRows.filter(r => getCategory(r) === currentCategory);
}

function setCategory(cat) {
  currentCategory = cat;
  if (cat !== 'all') document.getElementById('categoryInput').value = cat;
  renderManagers();
}

function renderCategoryFilter() {
  const btns = CATEGORIES.map(c => {
    const n = mgrRows.filter(r => getCategory(r) === c.value).length;
    return `<button class="cat-btn ${currentCategory === c.value ? 'active' : ''}" onclick="setCategory('${c.value}')">${c.plural}<span class="count">${n}</span></button>`;
  });
  btns.push(`<button class="cat-btn ${currentCategory === 'all' ? 'active' : ''}" onclick="setCategory('all')">All<span class="count">${mgrRows.length}</span></button>`);
  document.getElementById('catFilter').innerHTML = btns.join('');
}

const FIT_OPTIONS = [
  { value: 'tv', label: 'TV writers' },
  { value: 'genre', label: 'Genre' },
  { value: 'thriller-horror', label: 'Thriller / horror' },
  { value: 'writer-directors', label: 'Writer-directors' }
];
const FIT_LABELS = Object.fromEntries(FIT_OPTIONS.map(f => [f.value, f.label]));

function fitCheckboxes(selected, onchange) {
  return FIT_OPTIONS.map(f => `
    <label><input type="checkbox" value="${f.value}" ${selected.includes(f.value) ? 'checked' : ''} ${onchange ? `onchange="${onchange}"` : ''}>${f.label}</label>
  `).join('');
}

function parseFit(fit) {
  return String(fit || '').split(',').map(s => s.trim()).filter(Boolean);
}

function checkedFit(container) {
  return [...container.querySelectorAll('input[type=checkbox]:checked')].map(c => c.value).join(',');
}

// Sheets may hand dates back as ISO timestamps; normalize to yyyy-mm-dd for <input type="date">.
function normalizeDate(v) {
  if (!v) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  const d = new Date(v);
  if (isNaN(d.getTime())) return '';
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const [y, m, d] = dateStr.split('-').map(Number);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return Math.round((new Date(y, m - 1, d) - today) / 86400000);
}

function isFollowupDue(r) {
  const days = daysUntil(normalizeDate(r.followUp));
  return days !== null && days <= 7 && r.stage !== 'passed';
}

function switchTab(tab) {
  document.getElementById('panelManagers').classList.toggle('active', tab === 'managers');
  document.getElementById('panelCompetitions').classList.toggle('active', tab === 'competitions');
  document.getElementById('tabBtnManagers').classList.toggle('active', tab === 'managers');
  document.getElementById('tabBtnCompetitions').classList.toggle('active', tab === 'competitions');
}

// ---------- Managers ----------

async function loadManagers() {
  const statusMsg = document.getElementById('mgrStatus');
  const table = document.getElementById('mgrTable');
  try {
    const res = await fetch(API_URL + '?type=managers');
    if (!res.ok) throw new Error('Request failed');
    mgrRows = await res.json();
    renderManagers();
  } catch (e) {
    statusMsg.textContent = "Couldn't load from Google Sheets. Check the sheet is deployed and try again.";
    statusMsg.classList.add('error');
    statusMsg.style.display = 'block';
    table.style.display = 'none';
  }
}

async function addManager() {
  const companyEl = document.getElementById('companyInput');
  const contactEl = document.getElementById('contactInput');
  const emailEl = document.getElementById('emailInput');
  const stageEl = document.getElementById('stageInput');
  const notesEl = document.getElementById('notesInput');
  const categoryEl = document.getElementById('categoryInput');
  const warmthEl = document.getElementById('warmthInput');
  const introEl = document.getElementById('introInput');
  const followupEl = document.getElementById('followupInput');
  const fitEl = document.getElementById('fitInput');
  const addBtn = document.getElementById('addBtn');

  const company = companyEl.value.trim();
  const category = categoryEl.value;
  const contact = contactEl.value.trim();
  const email = emailEl.value.trim();
  const stage = stageEl.value;
  const notes = notesEl.value.trim();
  const warmth = warmthEl.value;
  const intro = introEl.value.trim();
  const followUp = followupEl.value;
  const fit = checkedFit(fitEl);
  if (!company) {
    companyEl.style.borderColor = '#a03434';
    return;
  }
  companyEl.style.borderColor = '';

  addBtn.disabled = true;
  try {
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ type: 'managers', action: 'add', category, company, contact, email, stage, notes, warmth, intro, followUp, fit })
    });
    companyEl.value = '';
    contactEl.value = '';
    emailEl.value = '';
    notesEl.value = '';
    warmthEl.value = '';
    introEl.value = '';
    followupEl.value = '';
    fitEl.querySelectorAll('input').forEach(c => { c.checked = false; });
    if (currentCategory !== 'all') currentCategory = category;
    await loadManagers();
  } catch (e) {
    alert("Couldn't save — check your connection and try again.");
  } finally {
    addBtn.disabled = false;
  }
}

async function updateStage(id, stage) {
  // Show the new stage date right away; the sheet stamps the same date.
  const row = mgrRows.find(r => String(r.id) === String(id));
  if (row) {
    row.stage = stage;
    row[stage + 'Date'] = todayLabel();
    renderManagers();
  }
  try {
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ type: 'managers', action: 'update', id, stage })
    });
    await loadManagers();
  } catch (e) {
    alert("Couldn't update — check your connection and try again.");
  }
}

function updateNotes(id, notes) {
  // Don't re-render: the user may be moving on to another field in this row.
  return updateManagerField(id, { notes }, false);
}

async function updateManagerField(id, fields, reload = true) {
  const row = mgrRows.find(r => String(r.id) === String(id));
  if (row) Object.assign(row, fields);
  if (reload) renderManagers();
  try {
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ type: 'managers', action: 'update', id, ...fields })
    });
  } catch (e) {
    alert("Couldn't update — check your connection and try again.");
  }
}

async function removeManager(id) {
  try {
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ type: 'managers', action: 'delete', id })
    });
    await loadManagers();
  } catch (e) {
    alert("Couldn't remove — check your connection and try again.");
  }
}

function getMostRecentDate(r) {
  const dates = STAGES.map(st => r[st.value + 'Date'])
    .filter(Boolean)
    .map(d => new Date(d).getTime())
    .filter(t => !isNaN(t));
  return dates.length ? Math.max(...dates) : 0;
}

function sortManagerRows(list) {
  const sortBy = document.getElementById('mgrSort').value;
  const STAGE_ORDER = Object.fromEntries(STAGES.map((st, i) => [st.value, i]));
  const sorted = [...list];
  if (sortBy === 'recent') {
    sorted.sort((a, b) => getMostRecentDate(b) - getMostRecentDate(a));
  } else if (sortBy === 'company') {
    sorted.sort((a, b) => a.company.localeCompare(b.company));
  } else if (sortBy === 'status') {
    sorted.sort((a, b) => (STAGE_ORDER[a.stage] ?? 99) - (STAGE_ORDER[b.stage] ?? 99));
  } else if (sortBy === 'followup') {
    // Rows with a follow-up date first (soonest/overdue on top), passed and undated at the bottom.
    const key = r => {
      const days = daysUntil(normalizeDate(r.followUp));
      return days === null || r.stage === 'passed' ? Infinity : days;
    };
    sorted.sort((a, b) => key(a) - key(b));
  } else if (sortBy === 'fit') {
    // More fit tags first; warm contacts break ties.
    const score = r => parseFit(r.fit).length * 2 + (r.warmth === 'warm' ? 1 : 0);
    sorted.sort((a, b) => score(b) - score(a));
  }
  return sorted;
}

function renderTotals(rows) {
  const counts = Object.fromEntries(STAGES.map(st => [st.value, 0]));
  rows.forEach(r => { if (r.stage in counts) counts[r.stage]++; });
  const due = rows.filter(isFollowupDue).length;
  const cat = CATEGORIES.find(c => c.value === currentCategory);
  const totalLabel = cat ? `Total ${cat.plural.toLowerCase()}` : 'Total contacts';
  const boxes = [
    `<div class="total-box all"><div class="num">${rows.length}</div><div class="label">${totalLabel}</div></div>`,
    `<div class="total-box due"><div class="num">${due}</div><div class="label">Follow up this week</div></div>`
  ];
  Object.keys(counts).forEach(stage => {
    boxes.push(`<div class="total-box"><div class="num">${counts[stage]}</div><div class="label">${STAGE_LABELS[stage]}</div></div>`);
  });
  document.getElementById('mgrTotals').innerHTML = boxes.join('');
}

function renderManagers() {
  const rows = visibleRows();
  renderCategoryFilter();
  renderTotals(rows);
  const tbody = document.getElementById('mgrTbody');
  const table = document.getElementById('mgrTable');
  const statusMsg = document.getElementById('mgrStatus');
  tbody.innerHTML = '';

  if (rows.length === 0) {
    const cat = CATEGORIES.find(c => c.value === currentCategory);
    statusMsg.textContent = `No ${cat ? cat.plural.toLowerCase() : 'contacts'} added yet.`;
    statusMsg.classList.remove('error');
    statusMsg.style.display = 'block';
    table.style.display = 'none';
    return;
  }

  statusMsg.style.display = 'none';
  table.style.display = 'table';

  const sortedRows = sortManagerRows(rows);
  sortedRows.forEach(r => {
    const tr = document.createElement('tr');
    const dateLines = STAGES
      .filter(st => r[st.value + 'Date'])
      .map(st => `${st.label}: ${r[st.value + 'Date']}`);

    const warmth = r.warmth === 'warm' || r.warmth === 'cold' ? r.warmth : '';
    const fit = parseFit(r.fit);
    const followUp = normalizeDate(r.followUp);
    const days = daysUntil(followUp);
    const followClass = days === null || r.stage === 'passed' ? '' : days < 0 ? 'overdue' : days <= 7 ? 'soon' : '';

    tr.innerHTML = `
      <td>
        ${escapeHtml(r.company)}${warmth ? `<span class="badge ${warmth}">${warmth}</span>` : ''}
        ${r.intro ? `<div class="intro">Intro via ${escapeHtml(r.intro)}</div>` : ''}
        ${fit.length ? `<div class="fit-tags">${fit.map(f => `<span class="fit-tag">${escapeHtml(FIT_LABELS[f] || f)}</span>`).join('')}</div>` : ''}
      </td>
      <td>
        <select class="stage-select" onchange="updateManagerField('${r.id}', { category: this.value })">
          ${CATEGORIES.map(c => `<option value="${c.value}" ${getCategory(r)===c.value?'selected':''}>${c.label}</option>`).join('')}
        </select>
      </td>
      <td>${escapeHtml(r.contact || '—')}</td>
      <td>${escapeHtml(r.email || '—')}</td>
      <td>
        <select class="stage-select" onchange="updateStage('${r.id}', this.value)">${stageOptions(r.stage)}</select>
      </td>
      <td><input type="date" class="followup ${followClass}" value="${followUp}" onchange="updateManagerField('${r.id}', { followUp: this.value })"></td>
      <td class="actions"><button class="secondary" onclick="removeManager('${r.id}')">Remove</button></td>
    `;
    tbody.appendChild(tr);

    const tr2 = document.createElement('tr');
    tr2.className = 'detail-row';
    tr2.innerHTML = `
      <td colspan="7">
        <div class="detail-grid">
          <div class="dates">${dateLines.length ? dateLines.join('<br>') : 'No history yet'}</div>
          <div class="rel">
            <select onchange="updateManagerField('${r.id}', { warmth: this.value })">
              <option value="" ${warmth===''?'selected':''}>Warm / cold?</option>
              <option value="warm" ${warmth==='warm'?'selected':''}>Warm</option>
              <option value="cold" ${warmth==='cold'?'selected':''}>Cold</option>
            </select>
            <input type="text" placeholder="Who could introduce you?" value="${escapeAttr(r.intro || '')}" onchange="updateManagerField('${r.id}', { intro: this.value.trim() })">
            <div class="fit-checks">${fitCheckboxes(fit, `updateManagerField('${r.id}', { fit: checkedFit(this.closest('.fit-checks')) })`)}</div>
          </div>
          <textarea placeholder="Notes" onblur="updateNotes('${r.id}', this.value)">${escapeHtml(r.notes || '')}</textarea>
        </div>
      </td>
    `;
    tbody.appendChild(tr2);
  });
}

// ---------- Competitions ----------

async function loadCompetitions() {
  const statusMsg = document.getElementById('compStatus');
  const table = document.getElementById('compTable');
  try {
    const res = await fetch(API_URL + '?type=competitions');
    if (!res.ok) throw new Error('Request failed');
    compRows = await res.json();
    renderCompetitions();
  } catch (e) {
    statusMsg.textContent = "Couldn't load from Google Sheets. Check the Competitions tab exists and try again.";
    statusMsg.classList.add('error');
    statusMsg.style.display = 'block';
    table.style.display = 'none';
  }
}

async function addCompetition() {
  const nameEl = document.getElementById('compNameInput');
  const feeEl = document.getElementById('compFeeInput');
  const deadlineEl = document.getElementById('compDeadlineInput');
  const statusEl = document.getElementById('compStatusInput');
  const addBtn = document.getElementById('compAddBtn');

  const name = nameEl.value.trim();
  const fee = feeEl.value.trim();
  const deadline = deadlineEl.value.trim();
  const status = statusEl.value;
  if (!name) {
    nameEl.style.borderColor = '#a03434';
    return;
  }
  nameEl.style.borderColor = '';

  addBtn.disabled = true;
  try {
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ type: 'competitions', action: 'add', name, fee, deadline, status, notes: '' })
    });
    nameEl.value = '';
    feeEl.value = '';
    deadlineEl.value = '';
    await loadCompetitions();
  } catch (e) {
    alert("Couldn't save — check your connection and try again.");
  } finally {
    addBtn.disabled = false;
  }
}

async function updateCompStatus(id, status) {
  try {
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ type: 'competitions', action: 'update', id, status })
    });
    await loadCompetitions();
  } catch (e) {
    alert("Couldn't update — check your connection and try again.");
  }
}

async function updateCompNotes(id, notes) {
  try {
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ type: 'competitions', action: 'update', id, notes })
    });
  } catch (e) {
    alert("Couldn't save notes — check your connection and try again.");
  }
}

async function removeCompetition(id) {
  try {
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ type: 'competitions', action: 'delete', id })
    });
    await loadCompetitions();
  } catch (e) {
    alert("Couldn't remove — check your connection and try again.");
  }
}

function renderCompetitions() {
  const tbody = document.getElementById('compTbody');
  const table = document.getElementById('compTable');
  const statusMsg = document.getElementById('compStatus');
  tbody.innerHTML = '';

  if (compRows.length === 0) {
    statusMsg.textContent = 'No competitions or labs added yet.';
    statusMsg.classList.remove('error');
    statusMsg.style.display = 'block';
    table.style.display = 'none';
    return;
  }

  statusMsg.style.display = 'none';
  table.style.display = 'table';

  compRows.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml(r.name)}</td>
      <td>${escapeHtml(r.fee || '—')}</td>
      <td>${escapeHtml(r.deadline || '—')}</td>
      <td>
        <select class="stage-select" onchange="updateCompStatus('${r.id}', this.value)">
          <option value="considering" ${r.status==='considering'?'selected':''}>Considering</option>
          <option value="submitted" ${r.status==='submitted'?'selected':''}>Submitted</option>
          <option value="advanced" ${r.status==='advanced'?'selected':''}>Advanced</option>
          <option value="not-selected" ${r.status==='not-selected'?'selected':''}>Not selected</option>
        </select>
      </td>
      <td><textarea class="comp-notes" onblur="updateCompNotes('${r.id}', this.value)">${escapeHtml(r.notes || '')}</textarea></td>
      <td class="actions"><button class="secondary" onclick="removeCompetition('${r.id}')">Remove</button></td>
    `;
    tbody.appendChild(tr);
  });
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/"/g, '&quot;');
}

document.getElementById('fitInput').innerHTML = fitCheckboxes([]);
document.getElementById('stageInput').innerHTML = stageOptions('sent');

loadManagers();
loadCompetitions();
</script>
