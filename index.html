<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Splitting — Tracker</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f4f0;
    color: #1f1f1d;
    margin: 0;
    padding: 2rem 1rem;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: #6b6a65; font-size: 14px; margin: 0 0 16px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab-btn {
    font-size: 14px; padding: 8px 16px; border: 1px solid #d8d6cf;
    background: #fff; border-radius: 8px; cursor: pointer; color: #6b6a65;
  }
  .tab-btn.active { background: #1f1f1d; color: #fff; border-color: #1f1f1d; }
  .panel { display: none; }
  .panel.active { display: block; }
  .add-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .add-row2 { display: flex; gap: 8px; margin-bottom: 20px; }
  input, select, textarea {
    font-size: 14px; padding: 8px 10px; border: 1px solid #d8d6cf;
    border-radius: 8px; background: #fff; font-family: inherit;
  }
  input[type=text] { flex: 1; min-width: 140px; }
  textarea { flex: 1; resize: vertical; min-height: 36px; }
  button {
    font-size: 14px; padding: 8px 14px; border: 1px solid #1f1f1d;
    background: #1f1f1d; color: #fff; border-radius: 8px; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary { background: transparent; color: #1f1f1d; border: 1px solid #d8d6cf; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid #e5e3db; }
  th, td { text-align: left; padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #efeee8; vertical-align: top; }
  th { color: #6b6a65; font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
  tbody tr.detail-row:last-child td { border-bottom: none; }
  tbody tr:not(.detail-row) { border-top: 1px solid #e5e3db; }
  tbody tr:first-child { border-top: none; }
  td.actions { text-align: right; white-space: nowrap; }
  td.actions button { padding: 4px 8px; font-size: 12px; margin-left: 4px; }
  select.stage-select { font-size: 12px; padding: 4px 6px; }
  .detail-row td { padding: 6px 12px 14px; border-bottom: 2px solid #c9c7bd; }
  .detail-grid { display: flex; gap: 16px; align-items: flex-start; }
  .detail-grid .dates { flex: 0 0 220px; padding-top: 8px; }
  .detail-grid textarea { flex: 1; min-height: 50px; font-size: 13px; }
  .dates { font-size: 11px; color: #9b9a94; line-height: 1.5; white-space: nowrap; }
  .empty, .status { text-align: center; color: #9b9a94; padding: 20px; font-size: 14px; }
  .error { color: #a03434; }
  .comp-notes { width: 100%; font-size: 12px; min-height: 32px; }
  .totals { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .total-box {
    flex: 1; min-width: 90px; background: #fff; border: 1px solid #e5e3db;
    border-radius: 10px; padding: 10px 12px;
  }
  .total-box.all { background: #1f1f1d; border-color: #1f1f1d; color: #fff; }
  .total-box .num { font-size: 22px; font-weight: 600; line-height: 1.2; }
  .total-box .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: #6b6a65; }
  .total-box.all .label { color: #c9c7bd; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Splitting — tracker</h1>
  <p class="sub">Managers and competitions, synced with Google Sheets.</p>

  <div class="tabs">
    <button class="tab-btn active" id="tabBtnManagers" onclick="switchTab('managers')">Managers</button>
    <button class="tab-btn" id="tabBtnCompetitions" onclick="switchTab('competitions')">Competitions / labs</button>
  </div>

  <div class="panel active" id="panelManagers">
    <div class="totals" id="mgrTotals"></div>

    <div class="add-row">
      <input type="text" id="companyInput" placeholder="Company name" />
      <input type="text" id="contactInput" placeholder="Contact name (optional)" />
      <input type="text" id="emailInput" placeholder="Email" />
      <select id="stageInput">
        <option value="flagged">Flagged</option>
        <option value="sent" selected>Sent email</option>
        <option value="responded">Responded</option>
        <option value="pilot">Has pilot</option>
        <option value="passed">Passed</option>
      </select>
    </div>
    <div class="add-row2">
      <textarea id="notesInput" placeholder="Notes (optional)"></textarea>
      <button id="addBtn" onclick="addManager()">Add</button>
    </div>

    <div class="add-row" style="margin-bottom:14px;">
      <label style="font-size:13px; color:#6b6a65; align-self:center;">Sort by:</label>
      <select id="mgrSort" onchange="renderManagers()">
        <option value="recent">Most recent activity</option>
        <option value="company">Company name (A–Z)</option>
        <option value="status">Status</option>
      </select>
    </div>

    <div id="mgrStatus" class="status">Loading…</div>
    <table id="mgrTable" style="display:none;">
      <thead>
        <tr><th>Company</th><th>Contact</th><th>Email</th><th>Stage</th><th></th></tr>
      </thead>
      <tbody id="mgrTbody"></tbody>
    </table>
  </div>

  <div class="panel" id="panelCompetitions">
    <div class="add-row">
      <input type="text" id="compNameInput" placeholder="Competition / lab name" />
      <input type="text" id="compFeeInput" placeholder="Fee (e.g. $59)" style="max-width:110px;" />
      <input type="text" id="compDeadlineInput" placeholder="Deadline (e.g. Sept 20, 2026)" style="max-width:200px;" />
      <select id="compStatusInput">
        <option value="considering">Considering</option>
        <option value="submitted">Submitted</option>
        <option value="advanced">Advanced</option>
        <option value="not-selected">Not selected</option>
      </select>
      <button id="compAddBtn" onclick="addCompetition()">Add</button>
    </div>

    <div id="compStatus" class="status">Loading…</div>
    <table id="compTable" style="display:none;">
      <thead>
        <tr><th>Name</th><th>Fee</th><th>Deadline</th><th>Status</th><th>Notes</th><th></th></tr>
      </thead>
      <tbody id="compTbody"></tbody>
    </table>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzSIgRjjf9waWMqMvOKYduHb3LQ7QQ17TK4UlTOXZNsl0WYFSAsQRAl-fJpdGyIW1tYtw/exec';
let mgrRows = [];
let compRows = [];
const STAGE_LABELS = { flagged: 'Flagged', sent: 'Sent', responded: 'Responded', pilot: 'Has pilot', passed: 'Passed' };

function switchTab(tab) {
  document.getElementById('panelManagers').classList.toggle('active', tab === 'managers');
  document.getElementById('panelCompetitions').classList.toggle('active', tab === 'competitions');
  document.getElementById('tabBtnManagers').classList.toggle('active', tab === 'managers');
  document.getElementById('tabBtnCompetitions').classList.toggle('active', tab === 'competitions');
}

// ---------- Managers ----------

async function loadManagers() {
  const statusMsg = document.getElementById('mgrStatus');
  const table = document.getElementById('mgrTable');
  try {
    const res = await fetch(API_URL + '?type=managers');
    if (!res.ok) throw new Error('Request failed');
    mgrRows = await res.json();
    renderManagers();
  } catch (e) {
    statusMsg.textContent = "Couldn't load from Google Sheets. Check the sheet is deployed and try again.";
    statusMsg.classList.add('error');
    statusMsg.style.display = 'block';
    table.style.display = 'none';
  }
}

async function addManager() {
  const companyEl = document.getElementById('companyInput');
  const contactEl = document.getElementById('contactInput');
  const emailEl = document.getElementById('emailInput');
  const stageEl = document.getElementById('stageInput');
  const notesEl = document.getElementById('notesInput');
  const addBtn = document.getElementById('addBtn');

  const company = companyEl.value.trim();
  const contact = contactEl.value.trim();
  const email = emailEl.value.trim();
  const stage = stageEl.value;
  const notes = notesEl.value.trim();
  if (!company) {
    companyEl.style.borderColor = '#a03434';
    return;
  }
  companyEl.style.borderColor = '';

  addBtn.disabled = true;
  try {
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ type: 'managers', action: 'add', company, contact, email, stage, notes })
    });
    companyEl.value = '';
    contactEl.value = '';
    emailEl.value = '';
    notesEl.value = '';
    await loadManagers();
  } catch (e) {
    alert("Couldn't save — check your connection and try again.");
  } finally {
    addBtn.disabled = false;
  }
}

async function updateStage(id, stage) {
  try {
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ type: 'managers', action: 'update', id, stage })
    });
    await loadManagers();
  } catch (e) {
    alert("Couldn't update — check your connection and try again.");
  }
}

async function updateNotes(id, notes) {
  try {
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ type: 'managers', action: 'update', id, notes })
    });
  } catch (e) {
    alert("Couldn't save notes — check your connection and try again.");
  }
}

async function removeManager(id) {
  try {
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ type: 'managers', action: 'delete', id })
    });
    await loadManagers();
  } catch (e) {
    alert("Couldn't remove — check your connection and try again.");
  }
}

function getMostRecentDate(r) {
  const dates = [r.flaggedDate, r.sentDate, r.respondedDate, r.pilotDate, r.passedDate]
    .filter(Boolean)
    .map(d => new Date(d).getTime())
    .filter(t => !isNaN(t));
  return dates.length ? Math.max(...dates) : 0;
}

function sortManagerRows(list) {
  const sortBy = document.getElementById('mgrSort').value;
  const STAGE_ORDER = { flagged: 0, sent: 1, responded: 2, pilot: 3, passed: 4 };
  const sorted = [...list];
  if (sortBy === 'recent') {
    sorted.sort((a, b) => getMostRecentDate(b) - getMostRecentDate(a));
  } else if (sortBy === 'company') {
    sorted.sort((a, b) => a.company.localeCompare(b.company));
  } else if (sortBy === 'status') {
    sorted.sort((a, b) => (STAGE_ORDER[a.stage] ?? 99) - (STAGE_ORDER[b.stage] ?? 99));
  }
  return sorted;
}

function renderTotals() {
  const counts = { flagged: 0, sent: 0, responded: 0, pilot: 0, passed: 0 };
  mgrRows.forEach(r => { if (r.stage in counts) counts[r.stage]++; });
  const boxes = [`<div class="total-box all"><div class="num">${mgrRows.length}</div><div class="label">Total managers</div></div>`];
  Object.keys(counts).forEach(stage => {
    boxes.push(`<div class="total-box"><div class="num">${counts[stage]}</div><div class="label">${STAGE_LABELS[stage]}</div></div>`);
  });
  document.getElementById('mgrTotals').innerHTML = boxes.join('');
}

function renderManagers() {
  renderTotals();
  const tbody = document.getElementById('mgrTbody');
  const table = document.getElementById('mgrTable');
  const statusMsg = document.getElementById('mgrStatus');
  tbody.innerHTML = '';

  if (mgrRows.length === 0) {
    statusMsg.textContent = 'No managers added yet.';
    statusMsg.classList.remove('error');
    statusMsg.style.display = 'block';
    table.style.display = 'none';
    return;
  }

  statusMsg.style.display = 'none';
  table.style.display = 'table';

  const sortedRows = sortManagerRows(mgrRows);
  sortedRows.forEach(r => {
    const tr = document.createElement('tr');
    const dateLines = [];
    if (r.flaggedDate) dateLines.push(`${STAGE_LABELS.flagged}: ${r.flaggedDate}`);
    if (r.sentDate) dateLines.push(`${STAGE_LABELS.sent}: ${r.sentDate}`);
    if (r.respondedDate) dateLines.push(`${STAGE_LABELS.responded}: ${r.respondedDate}`);
    if (r.pilotDate) dateLines.push(`${STAGE_LABELS.pilot}: ${r.pilotDate}`);
    if (r.passedDate) dateLines.push(`${STAGE_LABELS.passed}: ${r.passedDate}`);

    tr.innerHTML = `
      <td>${escapeHtml(r.company)}</td>
      <td>${escapeHtml(r.contact || '—')}</td>
      <td>${escapeHtml(r.email || '—')}</td>
      <td>
        <select class="stage-select" onchange="updateStage('${r.id}', this.value)">
          <option value="flagged" ${r.stage==='flagged'?'selected':''}>Flagged</option>
          <option value="sent" ${r.stage==='sent'?'selected':''}>Sent email</option>
          <option value="responded" ${r.stage==='responded'?'selected':''}>Responded</option>
          <option value="pilot" ${r.stage==='pilot'?'selected':''}>Has pilot</option>
          <option value="passed" ${r.stage==='passed'?'selected':''}>Passed</option>
        </select>
      </td>
      <td class="actions"><button class="secondary" onclick="removeManager('${r.id}')">Remove</button></td>
    `;
    tbody.appendChild(tr);

    const tr2 = document.createElement('tr');
    tr2.className = 'detail-row';
    tr2.innerHTML = `
      <td colspan="5">
        <div class="detail-grid">
          <div class="dates">${dateLines.length ? dateLines.join('<br>') : 'No history yet'}</div>
          <textarea placeholder="Notes" onblur="updateNotes('${r.id}', this.value)">${escapeHtml(r.notes || '')}</textarea>
        </div>
      </td>
    `;
    tbody.appendChild(tr2);
  });
}

// ---------- Competitions ----------

async function loadCompetitions() {
  const statusMsg = document.getElementById('compStatus');
  const table = document.getElementById('compTable');
  try {
    const res = await fetch(API_URL + '?type=competitions');
    if (!res.ok) throw new Error('Request failed');
    compRows = await res.json();
    renderCompetitions();
  } catch (e) {
    statusMsg.textContent = "Couldn't load from Google Sheets. Check the Competitions tab exists and try again.";
    statusMsg.classList.add('error');
    statusMsg.style.display = 'block';
    table.style.display = 'none';
  }
}

async function addCompetition() {
  const nameEl = document.getElementById('compNameInput');
  const feeEl = document.getElementById('compFeeInput');
  const deadlineEl = document.getElementById('compDeadlineInput');
  const statusEl = document.getElementById('compStatusInput');
  const addBtn = document.getElementById('compAddBtn');

  const name = nameEl.value.trim();
  const fee = feeEl.value.trim();
  const deadline = deadlineEl.value.trim();
  const status = statusEl.value;
  if (!name) {
    nameEl.style.borderColor = '#a03434';
    return;
  }
  nameEl.style.borderColor = '';

  addBtn.disabled = true;
  try {
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ type: 'competitions', action: 'add', name, fee, deadline, status, notes: '' })
    });
    nameEl.value = '';
    feeEl.value = '';
    deadlineEl.value = '';
    await loadCompetitions();
  } catch (e) {
    alert("Couldn't save — check your connection and try again.");
  } finally {
    addBtn.disabled = false;
  }
}

async function updateCompStatus(id, status) {
  try {
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ type: 'competitions', action: 'update', id, status })
    });
    await loadCompetitions();
  } catch (e) {
    alert("Couldn't update — check your connection and try again.");
  }
}

async function updateCompNotes(id, notes) {
  try {
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ type: 'competitions', action: 'update', id, notes })
    });
  } catch (e) {
    alert("Couldn't save notes — check your connection and try again.");
  }
}

async function removeCompetition(id) {
  try {
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ type: 'competitions', action: 'delete', id })
    });
    await loadCompetitions();
  } catch (e) {
    alert("Couldn't remove — check your connection and try again.");
  }
}

function renderCompetitions() {
  const tbody = document.getElementById('compTbody');
  const table = document.getElementById('compTable');
  const statusMsg = document.getElementById('compStatus');
  tbody.innerHTML = '';

  if (compRows.length === 0) {
    statusMsg.textContent = 'No competitions or labs added yet.';
    statusMsg.classList.remove('error');
    statusMsg.style.display = 'block';
    table.style.display = 'none';
    return;
  }

  statusMsg.style.display = 'none';
  table.style.display = 'table';

  compRows.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml(r.name)}</td>
      <td>${escapeHtml(r.fee || '—')}</td>
      <td>${escapeHtml(r.deadline || '—')}</td>
      <td>
        <select class="stage-select" onchange="updateCompStatus('${r.id}', this.value)">
          <option value="considering" ${r.status==='considering'?'selected':''}>Considering</option>
          <option value="submitted" ${r.status==='submitted'?'selected':''}>Submitted</option>
          <option value="advanced" ${r.status==='advanced'?'selected':''}>Advanced</option>
          <option value="not-selected" ${r.status==='not-selected'?'selected':''}>Not selected</option>
        </select>
      </td>
      <td><textarea class="comp-notes" onblur="updateCompNotes('${r.id}', this.value)">${escapeHtml(r.notes || '')}</textarea></td>
      <td class="actions"><button class="secondary" onclick="removeCompetition('${r.id}')">Remove</button></td>
    `;
    tbody.appendChild(tr);
  });
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

loadManagers();
loadCompetitions();
</script>
</body>
</html>
